[project]
name = "xdisp"
version = "0.1.0"
description = "Watch, start and kill Xvfb displays (with x11vnc, openbox, and cua-driver) from one screen"
requires-python = ">=3.12"
dependencies = ["textual>=8.2.8,<9"]

[project.scripts]
xdisp = "xdisp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xdisp"]
